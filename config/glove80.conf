# config/glove80.conf
#
# NOTE: Kconfig has no trailing-comment syntax. Everything after "=" to
# the end of the line is the value, so "CONFIG_FOO=3  # three" assigns
# the string "3  # three" and fails. Comments go on their own lines.

# ── Mouse emulation ──────────────────────────────────────────────────
# Required for &mmv / &msc / &mkp on the Mouse layer.
# Called CONFIG_ZMK_MOUSE on older revisions — if a bump breaks mouse
# keys, check with: glove80-kconfig POINTING
CONFIG_ZMK_POINTING=y

# ── Power ────────────────────────────────────────────────────────────
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ── Battery reporting ────────────────────────────────────────────────
# A split reports only the CENTRAL (left) battery over BLE by default.
# These expose the right half as a second GATT characteristic. Host
# support for multiple batteries is undefined, so reading both takes a
# script: that's glove80-battery.
#
# If the build fails in central_bas_proxy.c, drop the PROXY line.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ── RGB ──────────────────────────────────────────────────────────────
# ZMK drives the Glove80's LEDs as one underglow strip: effect and colour
# apply to the whole board. Per-key layer colours don't exist upstream.
#
# READ THIS BEFORE CHANGING ANY *_START VALUE:
# Anything set at runtime with &rgb_ug is saved to flash and persists
# across restarts AND firmware flashes, and it OVERRIDES every
# CONFIG_ZMK_RGB_*_START below. So these only take effect on a keyboard
# that has never had its RGB touched, or after a Configuration Factory
# Reset. If the lights aren't behaving, the saved state is why — see
# `glove80-rgb fix`.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# On at boot, since the colour is a layer indicator.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Effect index: 0 solid, 1 breathe, 2 spectrum, 3 swirl.
# Solid is the only one that leaves RGB_COLOR_HSB alone — the animated
# effects rewrite the hue every frame and erase the layer colour.
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Catppuccin Mocha blue, matching RGB_BASE in the keymap.
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=217
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=75
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=25
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=2

CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5

# Both OFF, deliberately, and both cost battery.
#
# AUTO_OFF_IDLE kills the indicator exactly when you want it: the
# peripheral tracks its own activity, so the right half goes dark while
# you're typing left-hand keys. AUTO_OFF_USB blacks out the right half
# permanently on Bluetooth, since it is never the half holding the cable.
#
# Set both back to y once you no longer need the layer colours.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Colour changes on every layer switch mean frequent settings writes.
# A long debounce keeps flash wear down.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=600000
