# config/glove80.conf
#
# NOTE: Kconfig has no trailing-comment syntax. Everything after "=" to
# the end of the line is the value, so "CONFIG_FOO=3  # three" assigns
# the string "3  # three" and fails. Comments go on their own lines.

# ── Mouse emulation ──────────────────────────────────────────────────
# Required for &mmv / &msc / &mkp on the Mouse layer.
# Called CONFIG_ZMK_MOUSE on older revisions — if a bump breaks mouse
# keys, check with: glove80-kconfig POINTING
CONFIG_ZMK_POINTING=y

# ── Power ────────────────────────────────────────────────────────────
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ── Battery reporting ────────────────────────────────────────────────
# A split reports only the CENTRAL (left) battery over BLE by default.
# These expose the right half as a second GATT characteristic. Host
# support for multiple batteries is undefined, so reading both takes a
# script: that's glove80-battery.
#
# If the build fails in central_bas_proxy.c, drop the PROXY line.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ── RGB ──────────────────────────────────────────────────────────────
# ZMK drives the Glove80's LEDs as one underglow strip: effect and
# colour apply to the whole board. Per-key layer colours are not
# available upstream.
#
# 80 LEDs at full brightness wrecks battery life, hence: dark at boot,
# low brightness, solid colour, auto-off when idle or unplugged.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# Start dark; toggle from Sys + W
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Effect: 0 solid, 1 breathe, 2 spectrum, 3 swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Hue in degrees, 0-359. 225 is a cool blue.
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=225

# Saturation, percent
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=70

# Brightness, percent. 25 is plenty in a lit room.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=25

CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=2

CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
